<!DOCTYPE html>
<html>
<head>
    <title>3D BOX</title>
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        body { margin: 0; display: flex; font-family: sans-serif; }
        #menu { width: 250px; padding: 20px; background: #222; color: white; height: 100vh; }
        input { width: 100%; margin: 10px 0; }
        #canvas { flex-grow: 1; background: #444; }
    </style>
</head>
<body>
    <div id="menu">
        <h3>КОНСТРУКТОР</h3>
        Ширина: <input type="range" id="w" min="1" max="5" step="0.1" value="2">
        Висота: <input type="range" id="h" min="1" max="5" step="0.1" value="3">
        Глибина: <input type="range" id="d" min="1" max="5" step="0.1" value="1">
        <p>Крути мишкою, щоб бачити 3D</p>
    </div>
    <div id="canvas"></div>

    <script>
        const sc = new THREE.Scene();
        const cam = new THREE.PerspectiveCamera(75, (window.innerWidth-250)/window.innerHeight, 0.1, 1000);
        const ren = new THREE.WebGLRenderer({antialias: true});
        ren.setSize(window.innerWidth-250, window.innerHeight);
        document.getElementById('canvas').appendChild(ren.domElement);

        const geo = new THREE.BoxGeometry(1, 1, 1);
        const mat = new THREE.MeshNormalMaterial();
        const box = new THREE.Mesh(geo, mat);
        sc.add(box);
        cam.position.z = 5;

        function update() {
            box.scale.set(document.getElementById('w').value, document.getElementById('h').value, document.getElementById('d').value);
        }

        document.querySelectorAll('input').forEach(i => i.oninput = update);

        function animate() {
            requestAnimationFrame(animate);
            box.rotation.y += 0.01;
            ren.render(sc, cam);
        }
        update();
        animate();
    </script>
</body>
</html>
