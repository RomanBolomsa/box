<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>3D Конфигуратор корпусной мебели</title>

<!-- THREE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0f172a;
  font-family: Inter, Arial, sans-serif;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100%;
}

.panel {
  width: 360px;
  padding: 24px;
  background: #020617;
  box-shadow: 4px 0 20px rgba(0,0,0,.5);
  color: #e5e7eb;
  z-index: 10;
}

.panel h2 {
  margin: 0 0 20px;
  font-size: 20px;
}

.control {
  margin-bottom: 18px;
}

label {
  font-size: 13px;
  color: #94a3b8;
  display: flex;
  justify-content: space-between;
}

input[type=range] {
  width: 100%;
  margin-top: 6px;
}

.price {
  margin-top: 30px;
  font-size: 26px;
  font-weight: bold;
  color: #22c55e;
}

#scene {
  flex: 1;
}
</style>
</head>

<body>

<div class="app">
  <div class="panel">
    <h2>Конфигуратор шкафа</h2>

    <div class="control">
      <label>Ширина (мм) <span id="wVal"></span></label>
      <input type="range" id="width" min="600" max="2400" step="50" value="1200">
    </div>

    <div class="control">
      <label>Высота (мм) <span id="hVal"></span></label>
      <input type="range" id="height" min="1800" max="2700" step="50" value="2200">
    </div>

    <div class="control">
      <label>Глубина (мм) <span id="dVal"></span></label>
      <input type="range" id="depth" min="400" max="700" step="10" value="600">
    </div>

    <div class="price">
      Цена: <span id="price">0</span> ₴
    </div>
  </div>

  <div id="scene"></div>
</div>

<script>
/* ================== КОНСТАНТЫ ================== */
const MM_TO_M = 0.001;

/* ================== UI ================== */
const widthInput  = document.getElementById('width');
const heightInput = document.getElementById('height');
const depthInput  = document.getElementById('depth');

const wVal = document.getElementById('wVal');
const hVal = document.getElementById('hVal');
const dVal = document.getElementById('dVal');
const priceEl = document.getElementById('price');

/* ================== SCENE ================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);

/* CAMERA */
const camera = new THREE.PerspectiveCamera(45, (window.innerWidth-360)/window.innerHeight, 0.01, 100);
camera.position.set(2, 2, 3);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth - 360, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.getElementById('scene').appendChild(renderer.domElement);

/* CONTROLS */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 0.8;
controls.maxDistance = 6;

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);

/* FLOOR */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x1e293b })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

/* MATERIAL */
const cabinetMaterial = new THREE.MeshStandardMaterial({
  color: 0xc8a165,
  roughness: 0.4
});

let cabinet;

/* ================== CAMERA FIT ================== */
function fitCameraToObject(camera, object, offset = 1.3) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxSize = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * Math.PI / 180;
  let cameraZ = Math.abs(maxSize / 2 / Math.tan(fov / 2)) * offset;

  camera.position.set(
    center.x,
    center.y + maxSize * 0.4,
    center.z + cameraZ
  );

  camera.near = cameraZ / 100;
  camera.far  = cameraZ * 100;
  camera.updateProjectionMatrix();
  camera.lookAt(center);

  controls.target.copy(center);
}

/* ================== CABINET ================== */
function buildCabinet() {
  if (cabinet) scene.remove(cabinet);

  const w = widthInput.value * MM_TO_M;
  const h = heightInput.value * MM_TO_M;
  const d = depthInput.value * MM_TO_M;

  cabinet = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    cabinetMaterial
  );

  cabinet.position.y = h / 2;
  scene.add(cabinet);

  fitCameraToObject(camera, cabinet);
  calculatePrice();
}

/* ================== PRICE ================== */
function calculatePrice() {
  const w = widthInput.value;
  const h = heightInput.value;
  const d = depthInput.value;

  const area = (w*h*2 + w*d*2 + h*d*2) / 1_000_000;
  const edge = (w*4 + h*4 + d*4) / 1000;

  const ldsPrice   = 850;   // грн / м²
  const edgePrice  = 45;    // грн / м.п
  const assembly   = 1200;  // грн

  const price = area * ldsPrice + edge * edgePrice + assembly;
  priceEl.textContent = Math.round(price).toLocaleString();
}

/* ================== UPDATE ================== */
function updateUI() {
  wVal.textContent = widthInput.value;
  hVal.textContent = heightInput.value;
  dVal.textContent = depthInput.value;
  buildCabinet();
}

[widthInput, heightInput, depthInput].forEach(el =>
  el.addEventListener('input', updateUI)
);

updateUI();

/* ================== RENDER LOOP ================== */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ================== RESIZE ================== */
window.addEventListener('resize', () => {
  camera.aspect = (window.innerWidth - 360) / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth - 360, window.innerHeight);
});
</script>

</body>
</html>
