<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>3D Конструктор Шаф v2.0</title>
    <!-- Підключаємо бібліотеку прямо з надійного джерела -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        /* Усі стилі вже тут, файл style.css НЕ потрібен */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background: #2c3e50; color: white; overflow: hidden; }
        #menu { width: 320px; padding: 20px; background: #34495e; box-shadow: 4px 0 15px rgba(0,0,0,0.3); overflow-y: auto; z-index: 10; border-right: 2px solid #f39c12; }
        #viewer { flex-grow: 1; background: #ecf0f1; position: relative; }
        h2 { color: #f39c12; border-bottom: 1px dashed #5d6d7e; padding-bottom: 10px; margin-top: 0; text-transform: uppercase; font-size: 18px; }
        .group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; margin-bottom: 8px; color: #bdc3c7; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #f39c12; }
        .val { float: right; color: #f39c12; font-weight: bold; font-size: 15px; }
        button { width: 100%; padding: 15px; background: #e67e22; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #d35400; transform: translateY(-2px); }
        #price-box { margin-top: 30px; padding: 20px; background: #27ae60; border-radius: 8px; text-align: center; border: 2px solid #2ecc71; }
        .price-label { font-size: 14px; opacity: 0.9; }
        #price { font-size: 26px; font-weight: bold; display: block; margin-top: 5px; }
        .hint { font-size: 11px; color: #95a5a6; margin-top: 20px; line-height: 1.4; text-align: center; }
    </style>
</head>
<body>

<div id="menu">
    <h2>Конфігуратор Шафи</h2>
    
    <div class="group">
        <label>Ширина: <span id="wV" class="val">1800</span> мм</label>
        <input type="range" id="wI" min="1000" max="3000" value="1800">
    </div>

    <div class="group">
        <label>Висота: <span id="hV" class="val">2300</span> мм</label>
        <input type="range" id="hI" min="1500" max="2700" value="2300">
    </div>

    <div class="group">
        <label>Глибина: <span id="dV" class="val">600</span> мм</label>
        <input type="range" id="dI" min="400" max="900" value="600">
    </div>

    <div class="group">
        <label>Кількість секцій: <span id="sV" class="val">3</span></label>
        <input type="range" id="sI" min="2" max="5" value="3">
    </div>

    <button onclick="moveDoors()">ВІДКРИТИ / ЗАКРИТИ ДВЕРІ</button>

    <div id="price-box">
        <span class="price-label">Орієнтовна вартість:</span>
        <span id="price">0</span> грн
    </div>

    <div class="hint">
        Мишка: ЛКМ - оберт, ПКМ - зсув, Колесо - наближення.
    </div>
</div>

<div id="viewer"></div>

<script>
    // Ініціалізація сцени Three.js
    const view = document.getElementById('viewer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdde4e7);

    const camera = new THREE.PerspectiveCamera(45, view.clientWidth / window.innerHeight, 1, 10000);
    camera.position.set(2800, 1800, 2800);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(view.clientWidth, window.innerHeight);
    view.appendChild(renderer.domElement);

    // Світло
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6);
    sun.position.set(1500, 2500, 1500);
    scene.add(sun);

    // Сітка підлоги
    const grid = new THREE.GridHelper(4000, 20, 0xbdc3c7, 0xdfe6e9);
    scene.add(grid);

    const group = new THREE.Group();
    scene.add(group);

    let doorsOpen = false;

    // Функція створення панелей
    function createPart(w, h, d, x, y, z, color = 0x8b4513) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        
        // Контури деталей
        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x2c3e50 }));
        mesh.add(line);
        
        group.add(mesh);
        return mesh;
    }

    function update() {
        // Очищення сцени перед перемалюванням
        while(group.children.length > 0) group.remove(group.children[0]);

        const W = parseInt(document.getElementById('wI').value);
        const H = parseInt(document.getElementById('hI').value);
        const D = parseInt(document.getElementById('dI').value);
        const S = parseInt(document.getElementById('sI').value);
        const T = 18; // Товщина ДСП

        // Оновлення тексту в меню
        document.getElementById('wV').innerText = W;
        document.getElementById('hV').innerText = H;
        document.getElementById('dV').innerText = D;
        document.getElementById('sV').innerText = S;

        // Побудова КОРПУСУ
        createPart(W, T, D, 0, T/2, 0); // Дно
        createPart(W, T, D, 0, H - T/2, 0); // Дах
        createPart(T, H - 2*T, D, -W/2 + T/2, H/2, 0); // Ліва стійка
        createPart(T, H - 2*T, D, W/2 - T/2, H/2, 0); // Права стійка
        createPart(W - 4, H - 4, 4, 0, H/2, -D/2 + 2, 0x4d3227); // Задня стінка (ХДФ)

        // Перегородки (внутрішні стійки)
        const sw = (W - T * (S + 1)) / S;
        for (let i = 1; i < S; i++) {
            let posX = -W/2 + (sw + T) * i + T/2;
            createPart(T, H - 2*T, D - 40, posX, H/2, 20, 0x7e5a4a);
        }

        // Двері (система купе)
        const dw = W / 2 + 15;
        const offset = doorsOpen ? dw - 80 : 0;
        createPart(dw, H - 45, 20, -W/4 + offset/2, H/2, D/2 + 12, 0xd2b48c); // Двері 1
        createPart(dw, H - 45, 20, W/4 - offset/2, H/2, D/2 + 35, 0xe3c191);  // Двері 2

        // Розрахунок ціни
        const price = Math.round((W * H * D) / 1000000 * 22 + (S * 1500));
        document.getElementById('price').innerText = price.toLocaleString();

        camera.lookAt(0, H/2, 0);
    }

    // Функція анімації дверей
    function moveDoors() {
        doorsOpen = !doorsOpen;
        update();
    }

    // Оновлення при русі повзунків
    document.querySelectorAll('input').forEach(input => {
        input.oninput = update;
    });

    // Рендеринг
    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    // Корекція при зміні розміру вікна
    window.onresize = () => {
        camera.aspect = view.clientWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(view.clientWidth, window.innerHeight);
    };

    update();
    animate();
</script>

</body>
</html>
