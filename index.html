<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Конфигуратор корпусной мебели</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
    }
    .configurator {
      max-width: 420px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    .price {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #2c7;
    }
  </style>
</head>
<body>

<div class="configurator">
  <h2>Конфигуратор корпусной мебели</h2>

  <label>Ширина (см)</label>
  <input type="number" id="width" value="100">

  <label>Высота (см)</label>
  <input type="number" id="height" value="200">

  <label>Глубина (см)</label>
  <input type="number" id="depth" value="60">

  <label>Материал</label>
  <select id="material">
    <option value="1">ЛДСП</option>
    <option value="1.4">МДФ</option>
    <option value="2">Массив</option>
  </select>

  <div class="price">
    Цена: <span id="price">0</span> ₽
  </div>
</div>

<script>
  const inputs = document.querySelectorAll('input, select');
  const priceEl = document.getElementById('price');

  function calculatePrice() {
    const width = +document.getElementById('width').value;
    const height = +document.getElementById('height').value;
    const depth = +document.getElementById('depth').value;
    const material = +document.getElementById('material').value;

    // базовая формула (можно менять)
    const volume = (width * height * depth) / 1000000;
    const basePrice = 12000; // цена за м³
    const price = Math.round(volume * basePrice * material);

    priceEl.textContent = price.toLocaleString();
  }

  inputs.forEach(el => el.addEventListener('input', calculatePrice));
  calculatePrice();
</script>

</body>
</html>
