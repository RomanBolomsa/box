<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Шафа-Конфігуратор</title>
    <style>
        body { font-family: sans-serif; display: flex; margin: 0; height: 100vh; background: #f0f0f0; }
        #controls { width: 300px; background: #fff; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; }
        #viewer { flex-grow: 1; position: relative; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input { width: 100%; margin-top: 5px; }
        .val { float: right; color: #666; }
        h3 { margin-top: 0; border-bottom: 2px solid #8b4513; padding-bottom: 10px; color: #8b4513; }
        .price-box { margin-top: 20px; padding: 10px; background: #fffde7; border: 1px solid #ffe082; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="controls">
        <h3>Параметри шафи</h3>
        
        <label>Ширина (мм): <span id="wVal" class="val">1000</span></label>
        <input type="range" id="w" min="400" max="2500" value="1000">

        <label>Висота (мм): <span id="hVal" class="val">2000</span></label>
        <input type="range" id="h" min="500" max="2700" value="2000">

        <label>Глибина (мм): <span id="dVal" class="val">600</span></label>
        <input type="range" id="d" min="300" max="1000" value="600">

        <label>Товщина ДСП (мм): <span id="tVal" class="val">18</span></label>
        <input type="range" id="t" min="10" max="36" value="18">

        <div class="price-box">
            <span>Орієнтовна ціна:</span>
            <br><b style="font-size: 20px;"><span id="price">0</span> грн</b>
        </div>
        <p style="font-size: 12px; color: #888; margin-top: 20px;">* ЛКМ — обертати, ПКМ — зміщувати, коліщатко — зум</p>
    </div>
    <div id="viewer"></div>

    <!-- Виправлений Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const viewer = document.getElementById('viewer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0e0e0);

        const camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / window.innerHeight, 1, 10000);
        camera.position.set(1500, 1500, 1500);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(viewer.clientWidth, window.innerHeight);
        viewer.appendChild(renderer.domElement);

        // Світло
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(2000, 2000, 2000);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        // Управління мишкою
        const controls = new OrbitControls(camera, renderer.domElement);
        
        let cabinet = new THREE.Group();
        scene.add(cabinet);

        const wInput = document.getElementById('w'), 
              hInput = document.getElementById('h'), 
              dInput = document.getElementById('d'),
              tInput = document.getElementById('t');

        function createPanel(width, height, depth, x, y, z) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7 });
            const panel = new THREE.Mesh(geometry, material);
            panel.position.set(x, y, z);
            return panel;
        }

        function update() {
            // Очищення старої моделі
            while(cabinet.children.length > 0) { cabinet.remove(cabinet.children[0]); }

            const W = +wInput.value;
            const H = +hInput.value;
            const D = +dInput.value;
            const T = +tInput.value; // Товщина ДСП

            // 1. Дно
            cabinet.add(createPanel(W, T, D, 0, T/2, 0));
            // 2. Дах
            cabinet.add(createPanel(W, T, D, 0, H - T/2, 0));
            // 3. Ліва стійка
            cabinet.add(createPanel(T, H - 2*T, D, -W/2 + T/2, H/2, 0));
            // 4. Права стійка
            cabinet.add(createPanel(T, H - 2*T, D, W/2 - T/2, H/2, 0));
            // 5. Задня стінка (ХДФ)
            cabinet.add(createPanel(W - 2, H - 2, 4, 0, H/2, -D/2 + 2));

            // Оновлення тексту
            document.getElementById('wVal').innerText = W;
            document.getElementById('hVal').innerText = H;
            document.getElementById('dVal').innerText = D;
            document.getElementById('tVal').innerText = T;
            
            // Розрахунок ціни (умовно від об'єму матеріалу)
            const volume = (W * H * D) / 1000000;
            document.getElementById('price').innerText = Math.round(volume * 8 + 500);
        }

        [wInput, hInput, dInput, tInput].forEach(el => el.oninput = update);
        
        // Підтримка зміни розміру вікна
        window.addEventListener('resize', () => {
            camera.aspect = viewer.clientWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewer.clientWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        update();
        animate();
    </script>
</body>
</html>
