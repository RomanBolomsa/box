<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Шафа</title>
    <style>
        body { font-family: sans-serif; display: flex; margin: 0; height: 100vh; background: #f0f0f0; }
        #controls { width: 280px; background: #fff; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; }
        #viewer { flex-grow: 1; position: relative; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; }
        .val { float: right; font-weight: normal; color: #666; }
    </style>
</head>
<body>
    <div id="controls">
        <h3>Параметри шафи</h3>
        <label>Ширина: <span id="wVal" class="val">1000</span></label>
        <input type="range" id="w" min="400" max="2500" value="1000">
        <label>Висота: <span id="hVal" class="val">2000</span></label>
        <input type="range" id="h" min="500" max="2700" value="2000">
        <label>Глибина: <span id="dVal" class="val">600</span></label>
        <input type="range" id="d" min="300" max="1000" value="600">
        <label>Товщина: <span id="tVal" class="val">18</span></label>
        <input type="range" id="t" min="10" max="38" value="18">
        <p>Ціна: <b id="price">0</b> грн</p>
    </div>
    <div id="viewer"></div>

    <!-- ВИКОРИСТОВУЄМО ПРЯМЕ ПОСИЛАННЯ БЕЗ MAP -->
    <script type="module">
        import * as THREE from 'https://unpkg.com';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);
        const viewer = document.getElementById('viewer');
        const camera = new THREE.PerspectiveCamera(45, viewer.clientWidth / window.innerHeight, 1, 10000);
        camera.position.set(1500, 1000, 1500);
        camera.lookAt(0, 500, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(viewer.clientWidth, window.innerHeight);
        viewer.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        const light = new THREE.DirectionalLight(0xffffff, 0.5);
        light.position.set(1000, 1000, 1000);
        scene.add(light);

        let cabinet = new THREE.Group();
        scene.add(cabinet);

        const w = document.getElementById('w'), h = document.getElementById('h'), d = document.getElementById('d'), t = document.getElementById('t');

        function createPanel(width, height, depth, x, y, z) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                new THREE.MeshStandardMaterial({color: 0x8b4513})
            );
            mesh.position.set(x, y, z);
            cabinet.add(mesh);
        }

        function update() {
            while(cabinet.children.length > 0) cabinet.remove(cabinet.children[0]);
            
            const W = +w.value, H = +h.value, D = +d.value, T = +t.value;

            createPanel(W, T, D, 0, T/2, 0); // Дно
            createPanel(W, T, D, 0, H - T/2, 0); // Верх
            createPanel(T, H - 2*T, D, -W/2 + T/2, H/2, 0); // Ліва
            createPanel(T, H - 2*T, D, W/2 - T/2, H/2, 0); // Права
            createPanel(W - 4, H - 4, 4, 0, H/2, -D/2 + 2); // Задня

            document.getElementById('wVal').innerText = W;
            document.getElementById('hVal').innerText = H;
            document.getElementById('dVal').innerText = D;
            document.getElementById('tVal').innerText = T;
            document.getElementById('price').innerText = Math.round((W * H * D) / 1000000 * 12);
        }

        [w, h, d, t].forEach(el => el.oninput = update);
        update();

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
